# Hyprland triggers companion startup; systemd owns Waybar and SwayNC lifecycle.
# The packaged polkit unit locates its distribution-specific libexec binary.
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP && systemctl --user start waybar.service swaync.service
exec-once = hypridle
exec-once = swayosd-server
