# Hyprland triggers companion startup; systemd owns the graphical services.
# Tear down any previous graphical session before exporting this compositor's
# environment, then let the session target start its services and portals.
exec-once = systemctl --user stop hyprland-session.target graphical-session.target && dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP && (systemctl --user reset-failed waybar.service swaync.service hyprpolkitagent.service 2>/dev/null || true) && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target graphical-session.target
exec-once = hypridle
exec-once = swayosd-server
# Keep native volume monitoring active when no Thunar window is open.
exec-once = thunar --daemon
