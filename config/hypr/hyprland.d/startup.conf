# Hyprland triggers companion startup; systemd owns the graphical services.
# Import this compositor's environment before replacing any previous session.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP && (systemctl --user reset-failed waybar.service swaync.service hyprpolkitagent.service 2>/dev/null || true) && systemctl --user restart waybar.service swaync.service hyprpolkitagent.service
exec-shutdown = systemctl --user stop waybar.service swaync.service hyprpolkitagent.service
exec-once = hypridle
exec-once = swayosd-server
