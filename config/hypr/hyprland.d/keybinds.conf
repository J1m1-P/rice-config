$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, F, exec, thunar
bind = $mainMod, TAB, exec, pkill -x rofi || rofi -show drun -show-icons

# Windows
bind = $mainMod, C, killactive,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# System
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, loginctl lock-session
bindd = $mainMod, B, Toggle Waybar, exec, pkill -USR1 -x waybar

# Media
binddl = , XF86AudioNext, Next track, exec, swayosd-client --playerctl next
binddl = , XF86AudioPause, Pause, exec, swayosd-client --playerctl play-pause
binddl = , XF86AudioPlay, Play, exec, swayosd-client --playerctl play-pause
binddl = , XF86AudioPrev, Previous track, exec, swayosd-client --playerctl previous
binddle = , XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
binddle = , XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
binddle = , XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
binddl = , XF86AudioMicMute, Toggle microphone, exec, $HOME/.local/bin/waybar-microphone toggle
binddle = , XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
binddle = , XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower

# Utilities
bindd = $mainMod, F1, Show keybinding help, exec, $HOME/.local/bin/keybind-help
bindd = $mainMod, D, Toggle calendar, exec, $HOME/.local/bin/waycal-toggle
bindd = $mainMod, N, Toggle control center, exec, swaync-client --skip-wait --toggle-panel
bindd = SUPER, COMMA, Dismiss last notification, exec, swaync-client --close-latest
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, swaync-client --close-all
bindd = SUPER CTRL, COMMA, Open notifications panel, exec, swaync-client --toggle-panel
bindd = SUPER ALT, COMMA, Toggle silencing notifications, exec, swaync-client --toggle-dnd
$hyprshot = $HOME/.local/bin/hyprshot
bindd = , PRINT, Region screenshot, exec, $hyprshot -m region
bindd = ALT, PRINT, Window screenshot, exec, $hyprshot -m window
bindd = SHIFT, PRINT, Monitor screenshot, exec, $hyprshot -m output
