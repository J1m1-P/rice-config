# Minimal lock screen with password authentication.
$font = Monospace

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = rgba(1a1a1acc)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff0066ee)
    font_color = rgb(ffffff)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    rounding = 10
    position = 0, 0
    halign = center
    valign = center
}
