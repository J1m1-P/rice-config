$font = JetBrains Mono
$accent = rgba(728DBEff)
$text = rgba(e8e8e8ff)
$muted = rgba(b5bdcaff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgba(000000ff)
    blur_size = 8
    blur_passes = 3
    brightness = 0.42
}

label {
    monitor =
    text = $TIME
    font_family = $font
    color = $text
    font_size = 72
    position = 0, 135
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %b %d'
    font_family = $font
    color = $muted
    font_size = 18
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 1
    inner_color = rgba(000000cc)
    outer_color = $accent
    check_color = $accent
    fail_color = rgba(d94f70ff)
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##b5bdca">Password</span>
    fail_text = <span foreground="##d94f70">$FAIL</span>
    fade_on_empty = false
    rounding = 9
    position = 0, -55
    halign = center
    valign = center
}
