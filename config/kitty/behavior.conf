# Shell and pane/tab workflow.
shell_integration no-cursor
allow_remote_control no

# Keep new panes and tabs in the focused pane's working directory.
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t combine : new_tab_with_cwd : set_tab_title " "

# Scrollback and pager history.
scrollback_lines 50000
scrollback_pager_history_size 10

# Default layout and layout cycle.
enabled_layouts tall:bias=50;full_size=1;mirrored=false,fat,grid,splits,stack
